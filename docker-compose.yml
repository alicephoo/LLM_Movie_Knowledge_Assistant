services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: movie-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  movie-rag:
    build: .
    container_name: movie-rag-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
